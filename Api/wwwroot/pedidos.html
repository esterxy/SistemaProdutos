<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sabor & Brasa - Sistema de Pedidos">
    <title>Sabor & Brasa - Sistema de Pedidos</title>
    <link rel="icon" href="/img/logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="bg-mesh"><div class="orb"></div><div class="orb"></div><div class="orb"></div></div>

    <!-- LOGIN -->
    <div id="loginOverlay" class="login-overlay">
        <div class="login-card">
            <img src="/img/logo.png" alt="Sabor & Brasa" class="login-logo">
            <p class="login-subtitle">Sistema de Pedidos</p>
            <div id="loginError" class="login-error"></div>
            <div class="input-wrap">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <input class="login-input has-icon" type="text" id="loginUser" placeholder="Usuário" value="admin">
            </div>
            <div class="input-wrap">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                <input class="login-input has-icon" type="password" id="loginPass" placeholder="Senha" value="admin123">
            </div>
            <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:.5rem;padding:.9rem" onclick="fazerLogin()">
                Entrar no Sistema
            </button>
            <p class="login-hint">Demo: admin / admin123</p>
        </div>
    </div>

    <!-- APP -->
    <div id="app" style="display:none">
        <header>
            <div class="logo">
                <img src="/img/logo.png" alt="Sabor & Brasa" class="header-logo">
                Sabor & Brasa
            </div>
            <div class="header-right">
                <span id="userBadge" class="user-badge"></span>
                <a href="/" class="btn btn-secondary btn-sm">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                    Home
                </a>
                <button class="btn btn-secondary btn-sm" onclick="logout()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    Sair
                </button>
            </div>
        </header>

        <!-- HERO BANNER -->
        <div class="hero-banner">
            <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=1400&h=400&fit=crop" alt="Hambúrguer artesanal" class="hero-banner-img">
            <div class="hero-banner-overlay">
                <img src="/img/logo.png" alt="Logo" class="hero-banner-logo">
                <h2 class="hero-banner-title">Faça seu pedido</h2>
                <p class="hero-banner-sub">Escolha seus favoritos e peça agora!</p>
            </div>
        </div>

        <div class="wrapper">
            <div class="main-grid">
                <!-- CARDÁPIO -->
                <div>
                    <div class="section-title">
                        <span class="section-icon orange">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                        </span>
                        Cardápio
                    </div>
                    <div id="productsGrid" class="products-grid"></div>
                </div>

                <!-- CARRINHO -->
                <div class="cart-panel">
                    <div class="cart-card">
                        <div class="cart-header">
                            <div class="section-title" style="margin:0">
                                <span class="section-icon purple">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
                                </span>
                                Carrinho
                            </div>
                            <span id="cartCount" class="cart-count">0</span>
                        </div>

                        <div class="cart-body" id="cartBody">
                            <div class="cart-empty">
                                <div class="cart-empty-icon">
                                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.3"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
                                </div>
                                Seu carrinho está vazio
                                <br><small>Adicione itens do cardápio</small>
                            </div>
                        </div>

                        <div class="cart-footer">
                            <div class="input-wrap">
                                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                                <input class="cart-input has-icon" type="text" id="nomeCliente" placeholder="Nome do cliente...">
                            </div>
                            <div class="cart-total">
                                <span>Total</span>
                                <span class="cart-total-value" id="cartTotal">R$ 0,00</span>
                            </div>
                            <button class="btn btn-primary" style="width:100%;justify-content:center"
                                    id="btnFinalizar" onclick="finalizarPedido()" disabled>
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
                                Finalizar Pedido
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- PEDIDOS -->
            <div class="orders-section">
                <div class="section-title">
                    <span class="section-icon cyan">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
                    </span>
                    Pedidos Realizados
                    <button class="btn btn-secondary btn-sm" onclick="carregarPedidos()" style="margin-left:auto">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                        Atualizar
                    </button>
                </div>
                <div id="ordersList"></div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>
    <script src="/js/app.js"></script>
</body>
</html>
